name: 🏟️ 新增私人／民營羽球館
description: 政府資料沒收錄的私人球館，歡迎補充
title: "[球館] "
labels: ["type:venue", "needs-review"]
body:
  - type: input
    id: name
    attributes: {label: "球館名稱"}
    validations: {required: true}
  - type: dropdown
    id: city
    attributes:
      label: 縣市
      options:
        - 臺北市
        - 新北市
        - 基隆市
        - 桃園市
        - 新竹市
        - 新竹縣
        - 苗栗縣
        - 臺中市
        - 彰化縣
        - 南投縣
        - 雲林縣
        - 嘉義市
        - 嘉義縣
        - 臺南市
        - 高雄市
        - 屏東縣
        - 宜蘭縣
        - 花蓮縣
        - 臺東縣
        - 澎湖縣
        - 金門縣
        - 連江縣
    validations: {required: true}
  - type: input
    id: district
    attributes: {label: "行政區"}
  - type: input
    id: address
    attributes: {label: "地址"}
    validations: {required: true}
  - type: input
    id: tel
    attributes: {label: "電話"}
  - type: input
    id: website
    attributes: {label: "官網或預約網址", placeholder: "https://"}
  - type: input
    id: courts
    attributes: {label: "場地數量"}
  - type: textarea
    id: note
    attributes: {label: "租金與營業時間等備註"}
