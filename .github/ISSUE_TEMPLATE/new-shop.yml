name: 🛍️ 推薦球具店
description: 推薦可試打、穿線的實體羽球用品店
title: "[球具店] "
labels: ["type:shop", "needs-review"]
body:
  - type: input
    id: name
    attributes: {label: "店名"}
    validations: {required: true}
  - type: dropdown
    id: city
    attributes:
      label: 縣市
      options:
        - 臺北市
        - 新北市
        - 基隆市
        - 桃園市
        - 新竹市
        - 新竹縣
        - 苗栗縣
        - 臺中市
        - 彰化縣
        - 南投縣
        - 雲林縣
        - 嘉義市
        - 嘉義縣
        - 臺南市
        - 高雄市
        - 屏東縣
        - 宜蘭縣
        - 花蓮縣
        - 臺東縣
        - 澎湖縣
        - 金門縣
        - 連江縣
    validations: {required: true}
  - type: input
    id: address
    attributes: {label: "地址"}
    validations: {required: true}
  - type: input
    id: tel
    attributes: {label: "電話"}
  - type: input
    id: website
    attributes: {label: "網站或粉專", placeholder: "https://"}
  - type: checkboxes
    id: services
    attributes:
      label: 服務
      options:
        - label: 穿線
        - label: 試打
        - label: 二手收購
        - label: 球鞋
