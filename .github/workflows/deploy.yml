name: Deploy site
# 把 web/ 發佈到 GitHub Pages。手動、push 到 main、或被其他 workflow 呼叫時執行。
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # 私人 repo（免費方案）無法使用 Pages。公開 repo 並開啟 Pages 後，
    # 到 Settings → Secrets and variables → Actions → Variables 新增 PAGES_ENABLED = true 即會開始部署。
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
