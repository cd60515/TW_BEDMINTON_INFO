name: Update data
# 定期更新資料並檢查失效：
#   每 6 小時   → PTT 羽球板、臨打情報站、GRASS、LINE 社群（零打開團）
#   每週一 03:00 → iPlay 全台場館＋Overture Maps／OpenStreetMap 民營球館、球具店、俱樂部同步 + 全站連結/影片健康檢查
#   每月 1 日    → 重新搜尋各主題教學影片
on:
  schedule:
    - cron: "17 */6 * * *"
    - cron: "0 19 * * 0"
    - cron: "30 20 1 * *"
  workflow_dispatch:
    inputs:
      tasks:
        description: "要執行的任務（以空白分隔）：ptt pickups venues private links videos"
        default: "ptt pickups venues private links"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide tasks
        id: tasks
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ github.event.inputs.tasks }}
        run: |
          case "$SCHEDULE" in
            "17 */6 * * *") T="ptt pickups" ;;
            "0 19 * * 0")   T="ptt pickups venues private links" ;;
            "30 20 1 * *")  T="videos links" ;;
            *)              T="${INPUT:-ptt pickups venues private links}" ;;
          esac
          echo "tasks=$T" >> "$GITHUB_OUTPUT"
          echo "Tasks: $T"
      - name: PTT
        if: contains(steps.tasks.outputs.tasks, 'ptt')
        continue-on-error: true
        run: python scripts/fetch_ptt.py
      - name: Pickups (臨打情報站 / GRASS / LINE 社群)
        if: contains(steps.tasks.outputs.tasks, 'pickups')
        continue-on-error: true
        run: python scripts/fetch_pickups.py
      - name: Venues (iPlay)
        if: contains(steps.tasks.outputs.tasks, 'venues')
        continue-on-error: true
        run: python scripts/fetch_venues.py
      - name: Private halls (Overture Maps + OpenStreetMap)
        if: contains(steps.tasks.outputs.tasks, 'private')
        continue-on-error: true
        run: |
          pip install --quiet duckdb
          python scripts/fetch_private_venues.py
      - name: Videos
        if: contains(steps.tasks.outputs.tasks, 'videos')
        continue-on-error: true
        run: python scripts/refresh_videos.py
      - name: Link check
        id: links
        if: contains(steps.tasks.outputs.tasks, 'links')
        run: python scripts/check_links.py
      - name: Validate
        run: python scripts/validate.py
      - name: Build manifest
        run: python scripts/build_manifest.py
      - name: Commit
        id: commit
        run: |
          git config user.name "twb-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No changes"
          else
            git commit -m "data: 自動更新（${{ steps.tasks.outputs.tasks }}）"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Report broken links
        if: steps.links.outputs.broken != '' && steps.links.outputs.broken != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create broken-links --color d73a4a --description "排程檢查發現的失效連結" 2>/dev/null || true
          N=$(gh issue list --label broken-links --state open --json number -q '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --body-file reports/broken_links.md
          else gh issue create --title "🩺 連結健康檢查：發現失效連結" --label broken-links --body-file reports/broken_links.md; fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
