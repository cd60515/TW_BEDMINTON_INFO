name: Validate
on:
  pull_request:
  push:
    branches: [main]
    paths: ["web/data/**", "scripts/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate.py
      - name: JS syntax
        run: for f in web/assets/js/*.js; do node --input-type=module --check < "$f" || exit 1; done
